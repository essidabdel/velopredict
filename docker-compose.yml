# VéloPredict — infrastructure + collecte (Kafka, TimescaleDB, Redis,
# producer, archiver). Lancement : `docker compose up -d`.

name: velopredict

networks:
  velopredict-network:
    driver: bridge

volumes:
  kafka_data:
  timescale_data:
  redis_data:
  airflow_db_data:
  airflow_logs:

services:
  # ---------------------------------------------------------------------
  # Kafka — image officielle apache/kafka, mode KRaft (sans ZooKeeper),
  # noeud unique combinant les rôles broker + controller (suffisant pour
  # un projet scolaire).
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: velopredict-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_BROKER_PORT:-9092}:9092"
    environment:
      # Identité du noeud et rôles KRaft
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      # Listeners : PLAINTEXT pour les clients, CONTROLLER pour le quorum KRaft
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Réglages adaptés à un noeud unique
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - velopredict-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------
  # TimescaleDB (PostgreSQL + extension hypertables) — historique des
  # relevés station par station.
  # ---------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: velopredict-timescaledb
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-velopredict}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-velopredict}
    volumes:
      - timescale_data:/var/lib/postgresql/data
      # Schéma appliqué automatiquement au premier démarrage (volume vide).
      # Notre script crée lui-même l'extension timescaledb, donc il n'y a
      # plus besoin du script d'init intégré à l'image.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - velopredict-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-velopredict} -d ${POSTGRES_DB:-velopredict}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------
  # Redis — dernier état connu de chaque station (lecture rapide par
  # l'API et le frontend).
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: velopredict-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - velopredict-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-change-me} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------
  # Producer — interroge station_status.json toutes les
  # INGESTION_POLL_INTERVAL_SECONDS et publie chaque station dans Kafka.
  # ---------------------------------------------------------------------
  producer:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    container_name: velopredict-producer
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - velopredict-network

  # ---------------------------------------------------------------------
  # Archiver — consomme velib.station_status et insère par lots dans
  # TimescaleDB (commit des offsets après insertion réussie).
  # ---------------------------------------------------------------------
  archiver:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: velopredict-archiver
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-velopredict}:${POSTGRES_PASSWORD:-change-me}@timescaledb:5432/${POSTGRES_DB:-velopredict}
    depends_on:
      kafka:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - velopredict-network

  # ---------------------------------------------------------------------
  # Live — même topic Kafka que l'archiver (groupe de consumers séparé),
  # mais écrit le dernier état de chaque station dans Redis pour une
  # lecture rapide par l'API.
  # ---------------------------------------------------------------------
  live:
    build:
      context: .
      dockerfile: streaming/Dockerfile
    container_name: velopredict-live
    command: ["python", "-m", "streaming.live"]
    restart: unless-stopped
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - velopredict-network

  # ---------------------------------------------------------------------
  # API — FastAPI (consultation des stations, historique, statistiques).
  # Documentation interactive sur /docs une fois démarrée.
  # ---------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: velopredict-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-velopredict}:${POSTGRES_PASSWORD:-change-me}@timescaledb:5432/${POSTGRES_DB:-velopredict}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Modèles entraînés localement (python -m ml.retrain) montés en
      # lecture seule : un réentraînement met à jour l'API sans rebuild.
      - ./ml/models:/app/ml/models:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - velopredict-network

  # ---------------------------------------------------------------------
  # Frontend — React + Vite + react-leaflet, servi en statique par nginx.
  # Le navigateur appelle l'API directement sur son port publié
  # (VITE_API_BASE_URL, inliné au build) : pas de proxy, pas d'appel
  # inter-conteneurs pour ce service.
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: velopredict-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    networks:
      - velopredict-network

  # ---------------------------------------------------------------------
  # Outils d'inspection (démo / présentation uniquement) — PAS démarrés
  # par `docker compose up -d` : nécessitent le profil "tools".
  #   docker compose --profile tools up -d
  #   docker compose --profile tools down       (les arrêter ensuite)
  # Inspection seule : Kafka UI peut créer/supprimer des topics si on le
  # lui demande, mais on ne s'en sert ici que pour regarder.
  # ---------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: velopredict-kafka-ui
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: velopredict
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "${KAFKA_UI_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - velopredict-network

  adminer:
    image: adminer:4.8.1
    container_name: velopredict-adminer
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - velopredict-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: velopredict-redis-commander
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:-change-me}
    ports:
      - "${REDIS_COMMANDER_PORT:-8083}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - velopredict-network

  # ---------------------------------------------------------------------
  # Airflow (bonus Phase 7) — orchestration quotidienne de l'enrichissement
  # (météo, calendriers, référentiel stations). PAS démarré par
  # `docker compose up -d` : nécessite le profil "airflow".
  #   docker compose --profile airflow up -d
  #   docker compose --profile airflow down
  # Metastore séparé de TimescaleDB (métier) à dessein : l'orchestrateur
  # ne doit jamais dépendre du schéma applicatif, ni l'inverse.
  # Le réentraînement du modèle (ml.retrain) et le géocodage des stations
  # (ingestion.stations_geo) restent des commandes manuelles (voir
  # README) : opérations rares/ponctuelles, plus sûres hors planning
  # automatique qu'en DAG.
  # ---------------------------------------------------------------------
  airflow-db:
    image: postgres:16-alpine
    container_name: velopredict-airflow-db
    profiles: ["airflow"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-change-me}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    networks:
      - velopredict-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  airflow-init:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: velopredict-airflow-init
    profiles: ["airflow"]
    env_file: .env
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-change-me}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-too}
      # Auth manager par défaut d'Airflow 3 (pas de FAB, pas de "airflow
      # users create") : un utilisateur "admin:Admin" déclaré ici, mot de
      # passe généré au premier démarrage et affiché dans les logs de
      # l'api-server (voir la commande de vérification dans le README).
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "${AIRFLOW_ADMIN_USER:-admin}:Admin"
      # Airflow 3 : les tâches (exécutées par le scheduler/LocalExecutor)
      # parlent à l'"Execution API" plutôt qu'à la base directement.
      # Défaut = localhost:8080, faux dans un conteneur séparé de
      # l'api-server — d'où l'échec "Connection refused" sans cette ligne.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      # Signe/valide les jetons JWT que les tâches utilisent pour parler à
      # l'Execution API (ci-dessus) : sans valeur fixe partagée, chaque
      # conteneur en génère une différente au démarrage, et la tâche (signée
      # par le scheduler) se fait rejeter par l'api-server ("Invalid auth
      # token") faute de partager la même clé.
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:-change-me-too}
      DATABASE_URL: postgresql://${POSTGRES_USER:-velopredict}:${POSTGRES_PASSWORD:-change-me}@timescaledb:5432/${POSTGRES_DB:-velopredict}
    command: ["db", "migrate"]
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
      - ./ingestion:/opt/project/ingestion:ro
    depends_on:
      airflow-db:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    networks:
      - velopredict-network

  # Airflow 3 sépare le parsing des DAGs (dag-processor) du scheduler :
  # contrairement à Airflow 2, le scheduler seul ne suffit plus.
  airflow-dag-processor:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: velopredict-airflow-dag-processor
    profiles: ["airflow"]
    restart: unless-stopped
    command: dag-processor
    env_file: .env
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - velopredict-network

  airflow-apiserver:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: velopredict-airflow-apiserver
    profiles: ["airflow"]
    restart: unless-stopped
    command: api-server
    env_file: .env
    environment: *airflow-env
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - velopredict-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    container_name: velopredict-airflow-scheduler
    profiles: ["airflow"]
    restart: unless-stopped
    command: scheduler
    env_file: .env
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    networks:
      - velopredict-network
