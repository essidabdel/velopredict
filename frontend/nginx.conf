server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA : react-router gère le routing côté client, toute route inconnue
    # doit retomber sur index.html (sinon 404 nginx sur un refresh de
    # /stations/123 ou /dashboard).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fichiers hashés par Vite (assets/*) : cache long, le hash change si
    # le contenu change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
